<style>
/* A real 3D treehouse at the edge of a foggy forest; UI stays small and out of the way */
:root{--amber:#FFB54D;--glass:rgba(12,16,30,.45);--body:"Rubik",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}

#stage{position:fixed;inset:0}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;pointer-events:none;gap:6px}
.chip{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.grp{display:flex;gap:5px}
.hearts{color:#FF7A6A;letter-spacing:1px}
.tools{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:6px}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ib:disabled{opacity:.35}
.ib.on{background:rgba(255,190,110,.45);border-color:rgba(255,210,150,.8)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);max-width:68%;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 10px;font-size:11px;line-height:1.35;text-align:center;transition:opacity .6s;pointer-events:none}
.hint b{color:var(--amber)}
.hint.off{opacity:0}
.toast{position:fixed;left:50%;top:20%;transform:translate(-50%,-50%) scale(.85);opacity:0;font-weight:700;font-size:18px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.7);transition:opacity .5s,transform .6s cubic-bezier(.2,1.3,.4,1);pointer-events:none;white-space:nowrap}
.toast small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:2px}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.load{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font-size:13px;background:#0B1020;transition:opacity .8s}
.load i{display:block;width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.load i b{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}
.load.hide{opacity:0;pointer-events:none}
</style>

 avoidLeaves:LEAF_AVOID});

// ================= ground & vegetation: see ground.js (needs the oak to keep plants out of the roots) =================

const barkTris=TREE.tris;
// ================= physics world =================
const world=new RAPIER.World({x:0,y:-9.81,z:0});world.timestep=1/60;
world.createCollider(RAPIER.ColliderDesc.cuboid(80,.5,80).setTranslation(0,-.5,0).setFriction(.9));
{const vtx=new Float32Array(barkTris);const ind=new Uint32Array(vtx.length/3);for(let i=0;i<ind.length;i++)ind[i]=i;world.createCollider(RAPIER.ColliderDesc.trimesh(vtx,ind).setFriction(.9));}
// horizontal cross-sections of the bark every 10 cm: used to cut boards around the trunk and branches
const SL=[];for(let s=0;s<=130;s++){const y=s*.1;const segs=[];for(let i=0;i<barkTris.length;i+=9){const ya=barkTris[i+1],yb=barkTris[i+4],yc=barkTris[i+7];if((ya<y&&yb<y&&yc<y)||(ya>y&&yb>y&&yc>y))continue;const P=[];

  if(P.length>=4)segs.push(P[0],P[1],P[2],P[3]);}SL.push(segs);}

function inTrunk(x,y,z,m=.06){const s=SL[clamp(Math.round(y*10),0,SL.length-1)];let cr=0;const nearAxis=Math.hypot(x-TAX[0],z-TAX[1])<2.4;for(let i=0;i<s.length;i+=4){const x1=s[i],z1=s[i+1],x2=s[i+2],z2=s[i+3];
  if((z1>z)!==(z2>z)){const xi=x1+(z-z1)/(z2-z1)*(x2-x1);if(xi>x)cr++;}
  const dx=x2-x1,dz=z2-z1,L=dx*dx+dz*dz;let t=L?((x-x1)*dx+(z-z1)*dz)/L:0;t=clamp(t,0,1);const ex=x1+dx*t-x,ez=z1+dz*t-z;if(ex*ex+ez*ez<m*m)return true;}

function cullLeaves(){}

// ================= wood: every board is its own body =================
const BOARD_ROWS=8;

const PLANK_GLSL=`float pH(float n){return fract(sin(n*127.1)*43758.5453);}
float pH2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float pN(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(pH2(i),pH2(i+vec2(1,0)),f.x),mix(pH2(i+vec2(0,1)),pH2(i+vec2(1,1)),f.x),f.y);}
vec3 plank(vec3 lp,vec3 sz,float sd){
 float L=lp.x*sz.x, Wm=lp.y*sz.y;
 vec3 c0=vec3(.58,.33,.17),c1=vec3(.80,.53,.30);
 float wall=step(99.5,sd);
 vec3 col=mix(c0,c1,mix(pH(sd),.8,wall*.75));col*=.95+mix(.10,.04,wall)*pH(sd+4.1);
 float wob=pN(vec2(L*.9,sd))*2.2+pN(vec2(L*3.1,sd+7.))*.5;

 if(pH(sd+3.3)>.45){vec2 kc=vec2((pH(sd+1.)-.5)*sz.x*.8,(pH(sd+2.)-.5)*sz.y*.5);vec2 d=vec2(L,Wm)-kc;d.y*=2.2;float r=length(d);
  col*=mix(1.,.55,smoothstep(.045,.0,r))*(1.-.18*smoothstep(.11,.05,r)*(.5+.5*sin(r*160.)));}

const MAXB=1500;

const darkGeo=new THREE.BoxGeometry(1,1,1);const dRow=new THREE.InstancedBufferAttribute(new Float32Array(900),1),dTile=new THREE.InstancedBufferAttribute(new Float32Array(900),1);darkGeo.setAttribute('aRow',dRow);darkGeo.setAttribute('aTile',dTile);

function board(c,len,w,t,rot,opt={}){const q=new THREE.Quaternion().setFromEuler(rot||new THREE.Euler());

 const dark=!!opt.dark;const mesh=dark?beams:boards;const i=mesh.count++;const rowA=dark?dRow:aRow,tileA=dark?dTile:aTile;rowA.setX(i,rnd(0,97)+(opt.wall?100:0));tileA.setX(i,Math.max(.04,len/3.84));mesh.setColorAt(i,new THREE.Color().setScalar(opt.tint??rnd(.9,1.04)));

const colToBoard=new Map();

 const m=b.rb.mass();if(impulse)b.rb.applyImpulse({x:impulse.x*m,y:impulse.y*m,z:impulse.z*m},true);b.rb.applyTorqueImpulse({x:rnd(-.3,.3)*m*.05,y:rnd(-.3,.3)*m*.05,z:rnd(-.5,.5)*m*.05},true);splinters(V(b.rb.translation().x,b.rb.translation().y,b.rb.translation().z),8);sfx.crack();shake(.25);}
